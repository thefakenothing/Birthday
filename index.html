<style>
:root{--pink:#ffb3d1;--hot:#ff5fa3;--gold:#ffd77a;--red:#ff2d2d;--ink:#3a1030;--glass:rgba(255,255,255,.28);--rx:0;--ry:0;box-sizing:border-box;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#ffe3f0,#ffb3d1 55%,#ff8fc0);font-family:Cairo,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1.2px,transparent 1.6px);background-size:22px 22px;opacity:.5;pointer-events:none}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.dot{font-family:Doto,"Courier New",monospace;font-weight:900;letter-spacing:.06em}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);opacity:0;visibility:hidden;transform:scale(1.06);filter:blur(14px);transition:opacity 1.2s ease,transform 1.2s ease,filter 1.2s ease,visibility 0s 1.2s;perspective:1000px}
.scene.on{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity 1.2s ease,transform 1.2s ease,filter 1.2s ease,visibility 0s}
.tag{font-size:12px;letter-spacing:.25em;opacity:.7;margin-bottom:26px;direction:ltr}
.tag i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-inline-end:8px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.2}}
.btn{position:relative;border:1px solid rgba(255,255,255,.8);background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.15));backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);color:var(--ink);font:800 22px Cairo,sans-serif;padding:18px 54px;border-radius:999px;cursor:pointer;box-shadow:0 18px 40px rgba(255,80,150,.35),inset 0 1px 0 #fff;transition:transform .25s,box-shadow .25s}
.btn::before{content:"";position:absolute;top:50%;inset-inline-start:22px;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
.btn:hover{transform:translateY(-3px) scale(1.04)}.btn:active{transform:scale(.96)}
.btn.big{width:176px;height:176px;border-radius:50%;padding:0;font-size:30px;animation:pulse 2.4s infinite}
.btn.big::before{top:26px;inset-inline-start:50%;margin-inline-start:-4.5px}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 24px 60px rgba(255,80,150,.55),inset 0 1px 0 #fff}}
.hint{margin-top:30px;font-size:14px;opacity:.65}
/* gift */
#stage{position:relative;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(35deg) scale(1.15);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotateX(-22deg) rotateY(395deg) scale(1.15)}}
.cube,.lidw{position:absolute;left:0;top:0;transform-style:preserve-3d}
.face{position:absolute;left:0;top:0;backface-visibility:hidden}
.body .face{background:linear-gradient(90deg,transparent 41%,#ffe29a 41% 59%,transparent 59%),linear-gradient(#ff8fc0,#ff4f9c)}
.lid .face{background:linear-gradient(90deg,transparent 41%,#ffe29a 41% 59%,transparent 59%),linear-gradient(#ff9fcb,#ff5fa3)}
.body .t,.lid .t{background:linear-gradient(90deg,transparent 41%,#ffe29a 41% 59%,transparent 59%),linear-gradient(0deg,transparent 41%,#ffe29a 41% 59%,transparent 59%),#ff7ab5}
.body .t{background:radial-gradient(circle,#fff,#ffd0e6 60%,#ff9fcb)}
.r{filter:brightness(.86)}.l{filter:brightness(.7)}.b{filter:brightness(.78)}
.bow{position:absolute;width:64px;height:40px;border:9px solid #ffd77a;border-radius:50%;box-shadow:inset 0 0 8px rgba(0,0,0,.2)}
.knot{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(#fff2b8,#f2b53a);margin:-13px}
.shake{animation:shk .9s ease-in-out}
@keyframes shk{10%,50%,90%{margin-left:-8px}30%,70%{margin-left:8px}}
.lidw.go{animation:lid 1.6s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes lid{to{transform:translateY(-300px) rotateX(-50deg) rotateZ(30deg);opacity:0}}
#glow{position:absolute;width:420px;height:420px;margin:-210px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,240,170,.9) 20%,rgba(255,150,200,.4) 50%,transparent 70%);opacity:0;transform:scale(.1)}
#glow.go{animation:gl 2.6s ease-out forwards}
@keyframes gl{30%{opacity:1}to{opacity:0;transform:scale(2.6)}}
#stage.out{animation:none;transition:transform 1.4s cubic-bezier(.6,0,.9,.4),opacity 1.2s;transform:scale(3) rotateX(-22deg);opacity:0}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,#ffd0e6);opacity:0;pointer-events:none;z-index:40;transition:opacity .8s}
/* map */
#mapw{width:min(94vw,640px);transform-style:preserve-3d;transform:rotateX(calc(26deg + var(--rx)*1deg)) rotateY(calc(var(--ry)*1deg));transition:transform .2s;filter:drop-shadow(0 30px 25px rgba(150,40,90,.3))}
svg text{font-family:Cairo,sans-serif;font-weight:800}
.rip{transform-box:fill-box;transform-origin:center;animation:rp 2s infinite;fill:none;stroke:#2f6bff;stroke-width:2}
.rip.d{animation-delay:1s}.rip.rd{stroke:var(--red)}
@keyframes rp{from{transform:scale(1);opacity:.9}to{transform:scale(5);opacity:0}}
#cap{margin-top:8px;font-size:18px;font-weight:600;min-height:30px;text-align:center}
#nextb{margin-top:18px;opacity:0;pointer-events:none;transform:translateY(20px);transition:opacity .9s,transform .9s}
#nextb.show{opacity:1;pointer-events:auto;transform:none}
/* cake page */
#s4{justify-content:flex-start;overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:60px}
#cake{width:min(86vw,330px);flex:none;filter:drop-shadow(0 22px 22px rgba(150,40,90,.3));transform:rotateX(calc(var(--rx)*-.6deg)) rotateY(calc(var(--ry)*.6deg));cursor:pointer}
.fl{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transition:opacity 1s 2s}
.on .fl{opacity:1;animation:fk .35s infinite alternate}
@keyframes fk{to{transform:scale(1.12,.9) rotate(4deg)}}
h1{font-size:clamp(34px,10vw,58px);line-height:1;text-align:center;margin-top:10px;direction:ltr;background:linear-gradient(180deg,#fff,#ff7ab5 80%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(255,255,255,.6)) drop-shadow(0 10px 14px rgba(180,40,100,.35))}
.name{font-size:clamp(28px,8vw,44px);font-weight:800;margin-top:12px;display:flex;gap:14px;align-items:center;direction:ltr}
.name b{font-family:Doto,monospace;color:var(--hot)}
.date{font-family:Doto,monospace;font-weight:900;margin-top:6px;letter-spacing:.2em;font-size:20px;direction:ltr}
.date::before{content:"● ";color:var(--red)}
.card{margin-top:22px;width:min(92vw,520px);padding:26px 22px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 24px 50px rgba(200,60,120,.3),inset 0 1px 0 #fff;text-align:center;line-height:2.05;font-size:17px;font-weight:600}
.card p{margin:0}
.w{display:inline-block;opacity:0;transform:translateY(16px) scale(.96);filter:blur(8px);white-space:pre}
.card::before{content:"";position:absolute;top:0;left:50%;height:2px;width:0;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#ffd77a,transparent)}
.on .card::before{animation:ln 2.2s 3s cubic-bezier(.22,1,.36,1) forwards}
@keyframes ln{to{width:84%}}
.on .card{animation:cardin 1.7s 2s cubic-bezier(.22,1,.36,1) backwards}
@keyframes cardin{from{opacity:0;transform:translateY(40px) scale(.94);clip-path:inset(0 0 100% 0 round 28px)}to{clip-path:inset(0 0 0 0 round 28px)}}
@keyframes gw{0%{text-shadow:0 0 0 transparent}30%{text-shadow:0 0 14px #ffd77a,0 0 28px #fff}100%{text-shadow:0 0 0 transparent}}
@keyframes wr{to{opacity:1;transform:none;filter:none}}
.on .w{animation:wr 1.1s cubic-bezier(.22,1,.36,1) var(--d) forwards,gw 1.8s ease-out var(--d)}
.card p:last-child{margin-top:12px;font-weight:800;color:var(--hot)}
@keyframes rv{to{opacity:1;transform:none;filter:none}}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-start:12px;z-index:60;display:flex;gap:8px}
#top button{width:42px;height:42px;border-radius:50%;border:1px solid #fff;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:17px;cursor:pointer;color:var(--ink)}
body{background:transparent}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 20% 25%,rgba(255,215,122,.5),transparent 70%),radial-gradient(35% 35% at 80% 70%,rgba(255,120,190,.55),transparent 70%),radial-gradient(30% 30% at 70% 15%,rgba(210,170,255,.45),transparent 70%);filter:blur(30px);animation:au 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes au{to{transform:translate(4%,-3%) rotate(8deg) scale(1.1)}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:44;background:radial-gradient(circle at var(--mx,50%) var(--my,40%),rgba(255,255,255,.25),transparent 40%),radial-gradient(120% 120% at 50% 50%,transparent 55%,rgba(120,20,70,.4))}
.bars i{position:fixed;left:0;right:0;height:0;background:#1a0614;z-index:45;transition:height 1.6s cubic-bezier(.22,1,.36,1)}
.bars i:first-child{top:0}.bars i:last-child{bottom:0}.cine .bars i{height:9vh}
#credit{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:50%;transform:translateX(-50%);z-index:46;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.32);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);font:900 10px Doto,monospace;letter-spacing:.22em;white-space:nowrap;direction:ltr;color:var(--ink)}
#credit i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-inline-end:8px;box-shadow:0 0 8px var(--red)}
.scene{transition:opacity 1.6s cubic-bezier(.22,1,.36,1),transform 1.6s cubic-bezier(.22,1,.36,1),filter 1.6s ease,visibility 0s 1.6s}
.scene.on{transition:opacity 1.6s cubic-bezier(.22,1,.36,1) .15s,transform 1.6s cubic-bezier(.22,1,.36,1) .15s,filter 1.6s ease .15s,visibility 0s}
.ring{position:relative;padding:12px;border-radius:50%}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ffe9a8,#ff9ccc,#fff,#ffd77a,#ffe9a8);animation:rot 5s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0)}
@keyframes rot{to{transform:rotate(360deg)}}
.btn{border-color:rgba(255,230,160,.95);overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.7) 50%,transparent 60%);transform:translateX(-130%);animation:sw 4s 1s infinite}
.hint{font-family:Doto,monospace;letter-spacing:.3em;font-size:11px;direction:ltr}
#s1.on .tag{animation:rise2 1.6s .3s backwards}#s1.on .ring{animation:rise2 1.8s .7s backwards}#s1.on .hint{animation:rise2 1.6s 1.2s backwards}
@keyframes rise2{from{opacity:0;transform:translateY(30px);filter:blur(10px)}}
#shd{position:absolute;width:260px;height:60px;border-radius:50%;background:radial-gradient(rgba(120,20,70,.45),transparent 70%);top:calc(50% + 120px);filter:blur(6px)}
#iq{filter:drop-shadow(0 0 14px rgba(255,200,60,.85))}
h1,.name span{background-image:linear-gradient(110deg,#b8780f 0%,#ffe9a8 25%,#fff 40%,#ffd77a 55%,#b8780f 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
h1{animation:foil 5s linear infinite;filter:drop-shadow(0 2px 0 rgba(120,60,0,.4)) drop-shadow(0 12px 20px rgba(180,40,100,.35))}
.name span{animation:foil 5s linear infinite}
@keyframes foil{to{background-position:-250% 0}}
.on h1{animation:foil 5s linear infinite,rise2 1.6s .5s cubic-bezier(.22,1,.36,1) backwards}
.on #cake{animation:rise 1.8s cubic-bezier(.22,1,.36,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.85) rotateX(30deg)}}
.on .name{animation:rise2 1.4s 1s backwards}.on .date{animation:rise2 1.4s 1.4s backwards}
#cake{filter:drop-shadow(0 0 34px rgba(255,215,122,.75)) drop-shadow(0 22px 22px rgba(150,40,90,.3))}
.card{position:relative;overflow:hidden;border-color:rgba(255,225,150,.95);box-shadow:0 30px 60px rgba(200,60,120,.35),0 0 0 6px rgba(255,255,255,.18),inset 0 1px 0 #fff,inset 0 0 40px rgba(255,255,255,.25)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-130%);animation:sw 6s 6s infinite}
@keyframes sw{to{transform:translateX(130%)}}
.foot{margin-top:28px;text-align:center;font-size:13px;letter-spacing:.3em;opacity:0;direction:ltr}.foot small{font-size:9px;letter-spacing:.25em}
.on .foot{animation:rise2 1.6s 3.5s forwards}
.seq{text-align:center;opacity:0;direction:ltr}
.seq.in{animation:beat 1s cubic-bezier(.22,1,.36,1) forwards}
@keyframes beat{0%{opacity:0;transform:scale(1.6);filter:blur(16px)}18%{opacity:1;transform:scale(1);filter:none}82%{opacity:1;transform:scale(1);filter:none}100%{opacity:0;transform:scale(.88);filter:blur(12px)}}
.gold{background-image:linear-gradient(110deg,#b8780f 0%,#ffe9a8 25%,#fff 40%,#ffd77a 55%,#b8780f 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:foil 3s linear infinite;filter:drop-shadow(0 4px 0 rgba(120,60,0,.35)) drop-shadow(0 14px 24px rgba(180,40,100,.4))}
.cdw{position:relative;width:min(72vw,320px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;border:2px solid rgba(255,230,160,.95);background:radial-gradient(circle,rgba(255,255,255,.4),rgba(255,255,255,.08));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(255,80,150,.35),inset 0 0 40px rgba(255,255,255,.4)}
.cdw::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid #ffd77a;animation:rp2 1s ease-out infinite}
@keyframes rp2{to{transform:scale(1.35);opacity:0}}
.num{font:900 clamp(120px,40vw,220px)/1 Doto,"Courier New",monospace}
.gr .ar{font:800 clamp(40px,13vw,84px)/1.35 Cairo,sans-serif}
.gr .en{font:900 clamp(30px,10vw,70px)/1.2 Doto,"Courier New",monospace;letter-spacing:.06em;margin-top:6px}

<canvas id="fx"></canvas><div id="flash"></div><div id="vig"></div><div class="bars"><i></i><i></i></div><div id="credit"><i></i>DESIGNED BY NOTHING STUDIO © 2026</div>
